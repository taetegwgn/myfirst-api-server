apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
#  annotations:
#    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: sk146-myfirst-ingress
  namespace: class-5
  labels:
    app: sk146-myfirst-ingress
spec:
  ingressClassName: public-nginx
  rules:
  - host: sk146-myfirst-ingress.class-5.skala-ai.com
    http:
      paths:
      - backend:
          service:
            name: sk146-myfirst-api-server
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - 'sk146-myfirst-ingress.class-5.skala-ai.com'
    secretName: wildcard-class-5-skala-ai-com-tls
